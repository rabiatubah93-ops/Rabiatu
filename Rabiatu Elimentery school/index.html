        window.db = loadData();
        window.currentTab = 'dashboard';
        let html5QrCodeScanner = null;

        // Initialize Firebase Authentication
        async function setupCloudAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                const docRef = doc(firestoreDb, 'artifacts', appId, 'public', 'data', 'school_state', 'main');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const cloudData = docSnap.data();
                        if (cloudData) {
                            window.db = { ...window.db, ...cloudData };
                            localStorage.setItem('rabiatu_elem_db', JSON.stringify(window.db));
                            renderApp();
                        }
                    }
                }, (err) => console.log('Firestore snapshot sync fallback to local storage:', err));
            } catch (e) {
                console.warn('Using Local Data State mode:', e);
            }
        }

        function loadData() {
            const stored = localStorage.getItem('rabiatu_elem_db');
            if (stored) {
                try { return JSON.parse(stored); } catch(e) { console.error('Parse error', e); }
            }
            localStorage.setItem('rabiatu_elem_db', JSON.stringify(initialData));
            return JSON.parse(JSON.stringify(initialData));
        }

        async function saveData() {
            localStorage.setItem('rabiatu_elem_db', JSON.stringify(window.db));
            if (auth.currentUser) {
                try {
                    const docRef = doc(firestoreDb, 'artifacts', appId, 'public', 'data', 'school_state', 'main');
                    await setDoc(docRef, window.db, { merge: true });
                } catch(e) { console.warn('Cloud sync save skipped:', e); }
            }
        }

        window.resetData = function() {
            if (confirm('Reset all Rabiatu Elementary demo data to default state?')) {
                localStorage.removeItem('rabiatu_elem_db');
                window.db = loadData();
                showToast('Rabiatu Elementary Database reset successfully', 'info');
                renderApp();
            }
        }

            { id: 'classes', label: 'Classes & Schedule', icon: 'fa-calendar-days', roles: ['admin', 'teacher', 'student'] },

        document.addEventListener('DOMContentLoaded', () => {
            setupCloudAuth();
            initDateDisplay();
            setupEventListeners();
            renderApp();
        });

        function initDateDisplay() {
            const dateEl = document.getElementById('current-date-display');
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            dateEl.innerHTML = `<i class="fa-regular fa-calendar mr-2 text-sky-600"></i>${now.toLocaleDateString('en-US', options)}`;
        }

        function setupEventListeners() {
            // Role switcher
            const roleSelect = document.getElementById('role-selector');
            roleSelect.value = window.db.role || 'admin';
            roleSelect.addEventListener('change', (e) => {
                window.db.role = e.target.value;
                saveData();
                updateProfileBadge();
                renderNav();
                const allowed = navItems.filter(item => item.roles.includes(window.db.role)).map(i => i.id);
                if (!allowed.includes(window.currentTab)) {
                    window.currentTab = 'dashboard';
                }
                renderApp();
                showToast(`Switched active portal view to ${getRoleName(window.db.role)}`, 'success');
            });

            // Mobile sidebar toggles
            document.getElementById('open-mobile-sidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.remove('hidden');
            });
            const closeSidebar = () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            };
            document.getElementById('close-mobile-sidebar').addEventListener('click', closeSidebar);
            document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);

            document.getElementById('modal-close').addEventListener('click', closeModal);

            // Reset Data Button
            document.getElementById('reset-data-btn').addEventListener('click', window.resetData);

        function getRoleName(role) {
            switch(role) {
                case 'admin': return 'Administrator';
                case 'teacher': return 'Teacher';
                case 'student': return 'Student';
                case 'parent': return 'Parent / Finance';
                default: return 'User';
            }
        }

        function getActiveStudent() {
            return window.db.students.find(s => s.id === window.db.activeStudentId) || window.db.students[0];
        }

        function updateProfileBadge() {
            const nameEl = document.getElementById('user-name');
            const badgeEl = document.getElementById('user-role-badge');
            const avatarEl = document.getElementById('user-avatar');

                nameEl.textContent = 'Headmistress Hawa';
                badgeEl.textContent = 'School Administrator';
                avatarEl.src = 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=100&auto=format&fit=crop&q=80';
            } else if (window.db.role === 'teacher') {
                nameEl.textContent = 'Mrs. Mariama Conteh';
                badgeEl.textContent = 'Grade 4 Lead Teacher';
                avatarEl.src = 'https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&auto=format&fit=crop&q=80';
            } else if (window.db.role === 'student') {
                const activeStu = getActiveStudent();
                nameEl.textContent = activeStu.name;
                badgeEl.textContent = `${activeStu.id} • ${activeStu.grade}`;
                avatarEl.src = 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&auto=format&fit=crop&q=80';
            } else if (window.db.role === 'parent') {

            window.currentTab = tabId;

            document.getElementById('sidebar-overlay').classList.add('hidden');

        function renderApp() {

            const currentItem = navItems.find(i => i.id === window.currentTab);
            titleEl.textContent = currentItem ? currentItem.label : 'Dashboard';

            switch(window.currentTab) {
                case 'dashboard':
                    renderDashboardView(mainContainer);
                    break;
                case 'students':
                    renderStudentsView(mainContainer);
                    break;
                case 'teachers':
                    renderTeachersView(mainContainer);
                    break;
                case 'classes':
                    renderClassesView(mainContainer);
                    break;
                case 'attendance':
                    renderAttendanceView(mainContainer);
                    break;
                case 'grades':
                    renderGradesView(mainContainer);
                    break;
                case 'finance':

                    break;
                case 'announcements':

        window.filterStudents = function() {
            const search = document.getElementById('student-search').value.toLowerCase();
            const gradeFilter = document.getElementById('grade-filter').value;
            const tbody = document.getElementById('students-table-body');

            const filtered = window.db.students.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(search) || s.id.toLowerCase().includes(search);
                const matchesGrade = gradeFilter === '' || s.grade === gradeFilter;
                return matchesSearch && matchesGrade;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400 font-medium">No students found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(s => `

                    <td class="p-4 font-mono text-xs text-slate-500 font-semibold">${s.id}</td>

        window.submitAddStudent = function() {
            const name = document.getElementById('new-stu-name').value;
            const email = document.getElementById('new-stu-email').value;
            const grade = document.getElementById('new-stu-grade').value;
            const section = document.getElementById('new-stu-section').value;
            const gender = document.getElementById('new-stu-gender').value;
            const parentName = document.getElementById('new-stu-parent').value;
            const phone = document.getElementById('new-stu-phone').value;

            if (!name || !email) {
                showToast('Please fill all required fields', 'error');
                return;
            }

            const id = 'RES00' + (window.db.students.length + 1);
            const qrToken = `${id}-${name.replace(/\s+/g, '').toUpperCase()}-PASS`;

            window.db.students.push({
                id, name, email, grade, section, gender, parentName, phone,
                dob: '2017-01-01', status: 'Active', gpa: 3.5, feesPaid: false, qrToken
            });
            saveData();
            closeModal();
            renderStudentsView(document.getElementById('main-content'));

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Security CVV</label>
                                <input type="password" id="pay-cvv" placeholder="•••" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                            </div>
                        </div>
                    </form>
                </div>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-200">Cancel</button>
                <button onclick="submitOnlineFeePayment('${invoice.id}')" class="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700 shadow-md">
                    Process $${invoice.amount} Payment
                </button>
            `);
        }

        window.submitOnlineFeePayment = function(invId) {
            const invoice = window.db.finance.find(f => f.id === invId);
            if (invoice) {
                invoice.status = 'Paid';
                invoice.datePaid = new Date().toISOString().split('T')[0];
                saveData();
                closeModal();
                renderFinanceView(document.getElementById('main-content'));
                showToast(`Payment of $${invoice.amount} processed online successfully!`, 'success');
            }
        }

        window.openRecordPaymentModal = function() {
            showModal('Record Payment / Issue Invoice', `
                <form id="payment-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Student</label>
                        <select id="pay-stu-id" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium">
                            ${window.db.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fee Description</label>
                        <input type="text" id="pay-title" placeholder="e.g. Tuition Fee - Term 2" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Amount ($)</label>
                            <input type="number" id="pay-amount" placeholder="450" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Due Date</label>
                            <input type="date" id="pay-date" value="2026-11-30" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium">
                        </div>
                    </div>
                </form>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-200/60">Cancel</button>
                <button onclick="submitInvoiceRecord()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-sky-600 text-white hover:bg-sky-700 shadow-md">Issue Invoice</button>
            `);
        }

        window.submitInvoiceRecord = function() {
            const studentId = document.getElementById('pay-stu-id').value;
            const title = document.getElementById('pay-title').value;
            const amount = parseFloat(document.getElementById('pay-amount').value);
            const dueDate = document.getElementById('pay-date').value;

            const student = window.db.students.find(s => s.id === studentId);

            if (!title || isNaN(amount)) {
                showToast('Please fill all payment details accurately', 'error');
                return;
            }

            window.db.finance.unshift({
                id: 'INV-2026-0' + (window.db.finance.length + 1),
                studentId,
                studentName: student ? student.name : 'Unknown',
                title,
                amount,
                status: 'Pending',
                dueDate,
                datePaid: '-'
            });

            saveData();
            closeModal();
            renderFinanceView(document.getElementById('main-content'));
            showToast('New fee invoice generated successfully!', 'success');
        }

        // MODULE 8: ANNOUNCEMENTS & COMMUNICATION
        function renderAnnouncementsView(container) {
            container.innerHTML = `
                <div class="flex items-center justify-between mb-6">
                    <h3 class="font-bold text-slate-800 text-base">Noticeboard & Updates</h3>
                    ${window.db.role === 'admin' ? `
                    <button onclick="openAddNoticeModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md">
                        <i class="fa-solid fa-plus mr-1"></i> Post Announcement
                    </button>
                    ` : ''}
                </div>

                <div class="space-y-4">
                    ${window.db.announcements.map(a => `
                        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-sky-50 text-sky-700">${a.category}</span>
                                <span class="text-xs text-slate-400 font-medium">${a.date}</span>
                            </div>
                            <h4 class="text-base font-bold text-slate-800 mb-2">${a.title}</h4>
                            <p class="text-xs text-slate-600 leading-relaxed">${a.content}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        window.openAddNoticeModal = function() {
            showModal('Post New Notice', `
                <form id="notice-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Title</label>
                        <input type="text" id="notice-title" placeholder="Announcement title..." class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
                        <select id="notice-category" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium">
                            <option value="Academic">Academic</option>
                            <option value="Events">Events</option>
                            <option value="Notice">Notice</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Content</label>
                        <textarea id="notice-content" rows="4" placeholder="Type notice description here..." class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium"></textarea>
                    </div>
                </form>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-200/60">Cancel</button>
                <button onclick="submitNotice()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-sky-600 text-white hover:bg-sky-700 shadow-md">Publish</button>
            `);
        }

        window.submitNotice = function() {
            const title = document.getElementById('notice-title').value;
            const category = document.getElementById('notice-category').value;
            const content = document.getElementById('notice-content').value;

            if (!title || !content) {
                showToast('Please fill title and content', 'error');
                return;
            }

            window.db.announcements.unshift({
                id: Date.now(),
                title, category, content,
                date: new Date().toISOString().split('T')[0]
            });

            saveData();
            closeModal();
            renderAnnouncementsView(document.getElementById('main-content'));
            showToast('Notice published successfully!', 'success');
        }

        // UI UTILITIES: MODAL & TOAST MANAGERS
        function showModal(title, bodyHtml, footerHtml) {
            const modalContainer = document.getElementById('modal-container');
            const modalCard = document.getElementById('modal-card');
            
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml;

            modalContainer.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.closeModal = function() {
            const modalContainer = document.getElementById('modal-container');
            const modalCard = document.getElementById('modal-card');

            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modalContainer.classList.add('hidden');
            }, 200);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgClass = 'bg-slate-900 text-white';
            let icon = 'fa-circle-info';

            if (type === 'success') {
                bgClass = 'bg-emerald-600 text-white';
                icon = 'fa-circle-check';
            } else if (type === 'error') {
                bgClass = 'bg-rose-600 text-white';
                icon = 'fa-triangle-exclamation';
            }

            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 text-xs font-semibold pointer-events-auto transition-all transform translate-y-2 opacity-0 duration-200`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-sm"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 200);
            }, 3000);
        }
    </script>
</body>
</html>
